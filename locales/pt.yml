about:
  content: >
    # Sobre o IT-Tools

    O IT-Tools reúne utilitários práticos executados no navegador para desenvolvedores e profissionais de TI.

    ## Privacidade

    Os dados são processados localmente no navegador e não são enviados para um servidor. Evite processar dados confidenciais em dispositivos não confiáveis.

    ## Tecnologia e licença

    O site usa Vue 3 e Naive UI, é implantado no Cloudflare Pages e distribuído sob a licença GPL-3.0.

