about:
  content: >
    # About IT-Tools

    IT-Tools brings together practical browser-based utilities for developers and people working in IT.

    ## Privacy

    Tool data is processed locally in your browser and is not uploaded to a server. Avoid handling sensitive data on untrusted devices.

    ## Technology and license

    The site is built with Vue 3 and Naive UI, deployed on Cloudflare Pages, and distributed under the GPL-3.0 license.

