    categories:
      0: 1xx 信息响应
      1: 2xx 成功
      2: 3xx 重定向
      3: 4xx 客户端错误
      4: 5xx 服务器错误
    codes:
      100:
        name: 继续
        description: 服务器正在等待客户端发送请求正文。
      101:
        name: 切换协议
        description: 服务器已同意切换协议。
      102:
        name: 处理中
        description: 服务器正在处理请求，但尚无可用响应。
      103:
        name: 早期提示
        description: 服务器在最终 HTTP 消息之前返回部分响应头。
      200:
        name: 成功
        description: HTTP 请求成功时的标准响应。
      201:
        name: 已创建
        description: 请求已完成，并创建了新的资源。
      202:
        name: 已接受
        description: 请求已接受处理，但处理尚未完成。
      203:
        name: 非权威信息
        description: 请求成功，但原始响应内容已被转换代理修改。
      204:
        name: 无内容
        description: 服务器已成功处理请求，但不返回任何内容。
      205:
        name: 重置内容
        description: 服务器要求客户端重置发出请求的文档视图。
      206:
        name: 部分内容
        description: 由于客户端发送了范围请求头，服务器仅返回资源的一部分。
      207:
        name: 多状态
        description: 响应正文是 XML 消息，其中可以包含多个独立响应码。
      208:
        name: 已报告
        description: DAV 绑定成员已在多状态响应的前面部分列出。
      226:
        name: 已使用实例操作
        description: 服务器已完成资源请求，响应表示实例操作后的结果。
      300:
        name: 多种选择
        description: 客户端可以为该资源选择多个可用选项。
      301:
        name: 永久移动
        description: 当前及后续请求都应转向给定的 URI。
      302:
        name: 已找到
        description: 请求应临时重定向到另一个 URL。
      303:
        name: 查看其他位置
        description: 可使用 GET 方法从另一个 URI 获取请求结果。
      304:
        name: 未修改
        description: 自请求头指定的版本以来，资源未发生修改。
      305:
        name: 使用代理
        description: 请求的资源只能通过响应中指定的代理访问。
      306:
        name: 切换代理
        description: 该状态码已停用，原意为后续请求应使用指定代理。
      307:
        name: 临时重定向
        description: 本次请求应使用另一个 URI 重试，后续请求仍使用原 URI。
      308:
        name: 永久重定向
        description: 当前及后续请求都应使用另一个 URI 重试。
      400:
        name: 错误请求
        description: 由于明显的客户端错误，服务器无法或拒绝处理请求。
      401:
        name: 未授权
        description: 请求需要身份验证，但验证失败或尚未提供凭据。
      402:
        name: 需要付款
        description: 为将来使用保留，最初计划用于数字现金或小额支付方案。
      403:
        name: 禁止访问
        description: 请求有效，但服务器拒绝执行，用户可能缺少资源权限。
      404:
        name: 未找到
        description: 找不到请求的资源，但该资源将来可能可用。
      405:
        name: 方法不允许
        description: 请求的资源不支持当前请求方法。
      406:
        name: 不可接受
        description: 资源只能生成不符合请求 Accept 头要求的内容。
      407:
        name: 需要代理身份验证
        description: 客户端必须先向代理服务器进行身份验证。
      408:
        name: 请求超时
        description: 服务器等待请求时发生超时。
      409:
        name: 冲突
        description: 请求因编辑冲突等状态冲突而无法处理。
      410:
        name: 已失效
        description: 请求的资源已永久不可用。
      411:
        name: 需要内容长度
        description: 请求未提供资源所要求的内容长度。
      412:
        name: 前置条件失败
        description: 服务器不满足请求者设置的一个或多个前置条件。
      413:
        name: 请求体过大
        description: 请求大小超过服务器愿意或能够处理的范围。
      414:
        name: URI 过长
        description: 提供的 URI 过长，服务器无法处理。
      415:
        name: 不支持的媒体类型
        description: 请求实体的媒体类型不受服务器或资源支持。
      416:
        name: 范围无法满足
        description: 客户端请求了文件的一部分，但服务器无法提供该范围。
      417:
        name: 预期失败
        description: 服务器无法满足 Expect 请求头字段的要求。
      418:
        name: 我是一个茶壶
        description: 服务器拒绝使用茶壶冲泡咖啡。
      421:
        name: 请求目标错误
        description: 请求被发送到无法生成响应的服务器。
      422:
        name: 无法处理的实体
        description: 请求格式正确，但因语义错误而无法执行。
      423:
        name: 已锁定
        description: 正在访问的资源已被锁定。
      424:
        name: 依赖失败
        description: 由于先前的请求失败，当前请求也失败。
      425:
        name: 过早
        description: 服务器不愿承担处理可能被重放请求的风险。
      426:
        name: 需要升级
        description: 客户端应切换到 TLS 等不同协议。
      428:
        name: 需要前置条件
        description: 源服务器要求请求必须带有条件。
      429:
        name: 请求过多
        description: 用户在指定时间内发送了过多请求。
      431:
        name: 请求头字段过大
        description: 单个或全部请求头字段过大，服务器拒绝处理。
      451:
        name: 因法律原因不可用
        description: 服务器运营者收到法律要求，必须拒绝访问请求的资源。
      500:
        name: 服务器内部错误
        description: 服务器遇到意外情况，且没有更具体的错误信息可用。
      501:
        name: 尚未实现
        description: 服务器不识别请求方法，或没有能力完成请求。
      502:
        name: 错误网关
        description: 服务器作为网关或代理时，从上游服务器收到无效响应。
      503:
        name: 服务不可用
        description: 服务器因过载或维护而暂时不可用。
      504:
        name: 网关超时
        description: 服务器作为网关或代理时，未及时收到上游响应。
      505:
        name: 不支持的 HTTP 版本
        description: 服务器不支持请求中使用的 HTTP 协议版本。
      506:
        name: 变体协商
        description: 请求的透明内容协商产生了循环引用。
      507:
        name: 存储空间不足
        description: 服务器无法存储完成请求所需的表示形式。
      508:
        name: 检测到循环
        description: 服务器在处理请求时检测到无限循环。
      510:
        name: 未扩展
        description: 服务器需要请求提供更多扩展才能完成处理。
      511:
        name: 需要网络身份验证
        description: 客户端需要通过身份验证才能访问网络。
