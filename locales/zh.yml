about:
  content: >
    # 关于 IT-Tools

    IT-Tools 汇集了面向开发人员和 IT 从业者的常用工具，可直接在浏览器中使用。

    ## 隐私

    工具的数据处理均在浏览器本地完成，不会上传到服务器。仍请避免在不受信任的设备上处理敏感数据。

    ## 技术与许可

    本站采用 Vue 3 和 Naive UI 构建，并通过 Cloudflare Pages 部署。项目依据 GPL-3.0 许可证发布。

