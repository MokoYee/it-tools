about:
  content: >
    # Sobre IT-Tools

    IT-Tools reúne utilidades prácticas que funcionan en el navegador para desarrolladores y profesionales de TI.

    ## Privacidad

    Los datos se procesan localmente en el navegador y no se envían a un servidor. Evite procesar datos sensibles en dispositivos que no sean de confianza.

    ## Tecnología y licencia

    El sitio está construido con Vue 3 y Naive UI, se despliega en Cloudflare Pages y se distribuye bajo la licencia GPL-3.0.

