about:
  content: >
    # À propos de IT-Tools

    IT-Tools rassemble des utilitaires pratiques utilisables dans le navigateur par les développeurs et les professionnels de l'informatique.

    ## Confidentialité

    Les données sont traitées localement dans le navigateur et ne sont pas envoyées à un serveur. Évitez de traiter des données sensibles sur un appareil non fiable.

    ## Technologie et licence

    Le site utilise Vue 3 et Naive UI, est déployé sur Cloudflare Pages et distribué sous licence GPL-3.0.

