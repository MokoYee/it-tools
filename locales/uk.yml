about:
  content: >
    # Про IT-Tools

    IT-Tools об'єднує практичні браузерні інструменти для розробників і фахівців з IT.

    ## Конфіденційність

    Дані обробляються локально у браузері й не надсилаються на сервер. Не обробляйте конфіденційні дані на ненадійних пристроях.

    ## Технології та ліцензія

    Сайт створено на Vue 3 і Naive UI, розгорнуто через Cloudflare Pages та поширюється за ліцензією GPL-3.0.

